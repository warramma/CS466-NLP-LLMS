[project]
name = "ytllms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "warramma", email = "wrammazy@mail.bradley.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-model-profiles>=0.0.6",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ytllms = "ytllms:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
